name: Device documentation

on: [push, pull_request]

permissions:
  contents: read

jobs:
  porting-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: FFT-infra/UniXNU
          path: UniXNU
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the porting record
        run: python3 UniXNU/scripts/porting-record.py check --device .
